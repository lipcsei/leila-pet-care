<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .gold { fill: none; stroke: #b07a1b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .text { fill: #b07a1b; font-family: "Brush Script MT", cursive; font-size: 160px; }
    .sub { fill: #b07a1b; font-family: Arial, sans-serif; font-size: 40px; letter-spacing: 6px; }
  </style>

  <!-- Dog -->
  <path class="gold" d="M150,150 
    C120,120 80,120 70,160 
    C60,200 90,220 130,210 
    C160,205 180,180 170,150 
    C165,140 155,140 150,150 Z"/>

  <!-- Cat -->
  <path class="gold" d="M200,170 
    C190,140 220,130 240,150 
    C260,130 290,140 280,170 
    C270,200 230,200 200,170 Z"/>

  <!-- Leila text -->
  <text x="300" y="200" class="text">Leila</text>

  <!-- Pet Care -->
  <text x="420" y="300" class="sub">PET CARE</text>
</svg>
